# PrivacyFlow Docker Compose Configuration
# 
# Usage:
#   docker-compose up -d              # Start in background
#   docker-compose logs -f            # View logs
#   docker-compose down               # Stop
#
# For Raspberry Pi with camera:
#   docker-compose -f docker-compose.yml -f docker-compose.rpi.yml up -d

version: '3.8'

services:
  privacyflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privacyflow
    
    # Camera access (uncomment for USB camera)
    # devices:
    #   - /dev/video0:/dev/video0
    
    # For Raspberry Pi camera
    # devices:
    #   - /dev/vchiq:/dev/vchiq
    
    volumes:
      # Configuration (editable)
      - ./config.yaml:/app/config.yaml:ro
      
      # Persistent storage for aggregate data only
      - privacyflow_data:/app/data
      
      # Logs
      - ./logs:/app/logs
      
      # Models (mount external models)
      # - ./models:/app/models:ro
    
    environment:
      - STATION_ID=${STATION_ID:-station_001}
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - API_PORT=${API_PORT:-5000}
      - TZ=${TZ:-UTC}
    
    ports:
      # REST API
      - "${API_PORT:-5000}:5000"
    
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for persistence
volumes:
  privacyflow_data:
    driver: local

# Optional: Network configuration
networks:
  default:
    name: privacyflow_network
